<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>列表样式参考</title>
  <style>
    @font-face {
      font-family: "D-DIN-PRO-700-Bold";
      src: url("./fonts/D-DIN-PRO-700-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .list-page {
      min-height: 100vh;
      padding: 24px 15px;
      background: #fff;
    }

    .list-module + .list-module {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid #e8e8e8;
    }

    .module-title {
      display: inline-block;
      margin: 0 0 18px;
      padding-bottom: 4px;
      border-bottom: 3px solid #e62828;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
      color: #333;
    }

    .summary-list {
      display: grid;
      row-gap: 18px;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .summary-list__item {
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr);
      column-gap: 9px;
      align-items: start;
    }

    .summary-list__index {
      font-family: "D-DIN-PRO-700-Bold", sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 27px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      color: #333;
    }

    .summary-list__text {
      font-size: 15px;
      line-height: 1.8;
      color: #333;
    }

    .summary-list__arrow {
      width: 16px;
      height: 16px;
      margin-left: -3px;
      vertical-align: -3px;
    }
  </style>
</head>
<body>
  <main class="list-page">
    <section class="list-module" aria-labelledby="module-a">
      <h2 class="module-title" id="module-a">模块标题</h2>
      <ol class="summary-list">
        <li class="summary-list__item">
          <span class="summary-list__index">01</span>
          <span class="summary-list__text">摘要文字保持简洁，箭头紧跟句尾。<img class="summary-list__arrow" src="./icons/arrow-right-bold.svg" alt=""></span>
        </li>
        <li class="summary-list__item">
          <span class="summary-list__index">02</span>
          <span class="summary-list__text">第二条列表用于确认序号、行高和间距。<img class="summary-list__arrow" src="./icons/arrow-right-bold.svg" alt=""></span>
        </li>
      </ol>
    </section>

    <section class="list-module" aria-labelledby="module-b">
      <h2 class="module-title" id="module-b">模块标题</h2>
      <ol class="summary-list">
        <li class="summary-list__item">
          <span class="summary-list__index">01</span>
          <span class="summary-list__text">多模块之间使用细线分隔，页面宽度保持自适应。<img class="summary-list__arrow" src="./icons/arrow-right-bold.svg" alt=""></span>
        </li>
        <li class="summary-list__item">
          <span class="summary-list__index">02</span>
          <span class="summary-list__text">复制此结构即可扩展更多列表项。<img class="summary-list__arrow" src="./icons/arrow-right-bold.svg" alt=""></span>
        </li>
      </ol>
    </section>
  </main>
</body>
</html>
